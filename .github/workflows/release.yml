name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .build
          key: engine-${{ hashFiles('engine/sources.lock.json') }}
          restore-keys: engine-

      - name: Build the native engine
        run: python3 scripts/build-engine.py

      - run: npm run build
      - run: python3 scripts/release.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Folio $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" releases/*.zip releases/*.tar.gz --clobber
